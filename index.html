<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAY BEE | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-shell">
    <section class="brand-card">
      <div class="logo-mark">ABE</div>
      <h1>AAY BEE ELECTRICALS &amp; CONSTRUCTION</h1>
      <p>Attendance &amp; Employee Management System</p>
    </section>

    <section class="card login-card">
      <h2>Login</h2>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" placeholder="Enter your email">

        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password">

        <label for="destination">Open</label>
        <select id="destination" required>
          <option value="attendance">Attendance Dashboard</option>
          <option value="employee">Employee Data</option>
        </select>

        <button type="submit">Login</button>
      </form>

      <p id="message" class="message"></p>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
